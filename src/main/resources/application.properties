spring.application.name=RadioBrowserAPI
server.port=${PORT:8080}
server.forward-headers-strategy=native
radio.api.base.url=https://de1.api.radio-browser.info/json

# Endereço público da aplicação (usado no link de redefinição de senha).
# Em produção, defina APP_BASE_URL no .env ou nas variáveis de ambiente.
app.base-url=${APP_BASE_URL:http://localhost:8080}


# —-------- Supabase (PostgreSQL) -
# Use a connection string do "Session pooler" (porta 5432) em
# Supabase > Project Settings > Database > Connection string > JDBC.
# Os valores vêm de variáveis de ambiente para não versionar a senha.
spring.datasource.url=${SUPABASE_DB_URL:jdbc:postgresql://aws-0-us-east-1.pooler.supabase.com:5432/postgres}
spring.datasource.username=${SUPABASE_DB_USER:postgres.sehffrsfrhudocqlchbo}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
# Pool pequeno: o plano free do Supabase limita conexões
spring.datasource.hikari.maximum-pool-size=5
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# As tabelas são criadas pelo SQL no Supabase; o Hibernate não altera o banco
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# =========================================================
# GMAIL
# =========================================================

# https://myaccount.google.com/apppasswords
# Credenciais reais ficam no arquivo .env (não versionado)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000


# =========================================================
# GOOGLE reCAPTCHA
# =========================================================

# Chaves reais ficam no arquivo .env (não versionado)
recaptcha.site-key=${RECAPTCHA_SITE_KEY}
recaptcha.secret-key=${RECAPTCHA_SECRET_KEY}

# =========================================================
# API CLIMA TEMPO
# =========================================================
# Chave fica no arquivo .env (não versionado). HTTPS para a chave não trafegar aberta.
weatherapi.api.apikey=${apiKey}
weatherapi.api.url=https://api.weatherapi.com/v1