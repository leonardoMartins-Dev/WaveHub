<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nova senha · WaveHub</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Anybody:ital,wdth,wght@0,75..150,400..900;1,75..150,400..900&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
    />
    <link rel="stylesheet" th:href="@{/css/auth.css}" />
  </head>

  <body>
    <main class="auth-layout">
      <!-- =====================================================
           LOGO
           ===================================================== -->
      <section class="auth-brand">
        <img class="auth-logo" th:src="@{/imgs/teste.png}" alt="WaveHub" width="1536" height="1024" />
        <p class="auth-tagline">Rádios ao vivo do mundo inteiro, num só lugar.</p>
      </section>

      <!-- =====================================================
           FORMULÁRIO DE NOVA SENHA
           ===================================================== -->
      <section class="auth-panel">
        <div class="auth-card">
          <h1 class="auth-title">Nova senha</h1>
          <p class="auth-lead">Escolha a nova senha da sua conta.</p>

          <p
            th:if="${param.erro != null and param.erro[0] == 'senhas'}"
            class="notice notice--error"
            role="alert"
          >
            As senhas não são iguais. Digite a mesma senha nos dois campos.
          </p>

          <form th:action="@{/resetpassword}" method="post" class="auth-form">
            <!-- Token recebido pelo link do e-mail -->
            <input type="hidden" name="token" th:value="${token}" />

            <label class="field">
              <span class="caps">Nova senha</span>
              <input type="password" name="senha" autocomplete="new-password" required />
            </label>

            <label class="field">
              <span class="caps">Confirme a nova senha</span>
              <input type="password" name="confirmarSenha" autocomplete="new-password" required />
            </label>

            <button type="submit" class="btn-primary">Salvar nova senha</button>
          </form>

          <p class="auth-links">
            <a th:href="@{/login}">Voltar para o login</a>
          </p>
        </div>
      </section>
    </main>
  </body>
</html>
